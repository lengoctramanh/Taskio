services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: taskio_postgres
    restart: always
    environment:
      POSTGRES_USER: taskio_user
      POSTGRES_PASSWORD: taskio_password
      POSTGRES_DB: taskio_db
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - taskio_postgres_data:/var/lib/postgresql/data

volumes:
  taskio_postgres_data: